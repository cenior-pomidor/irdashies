name: Windows Russian release

on:
  push:
    branches: [fix/complete-russian-localization]
    tags: [ru-v*]
  workflow_dispatch:
    inputs:
      tag:
        description: Unique prerelease tag (for example ru-v2.2.0-1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Install Electron before tests
        run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm test -- --run --no-coverage --maxWorkers=3
      - name: Build Windows installer
        run: npm run make -- --platform=win32 --arch=x64 --targets=@electron-forge/maker-squirrel
      - name: Verify and checksum installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem out/make/squirrel.windows/x64/*Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $hash = Get-FileHash -Algorithm SHA256 $installers[0].FullName
          "$($hash.Hash.ToLower())  $($installers[0].Name)" | Set-Content out/make/squirrel.windows/x64/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: irdashies-russian-windows-x64
          if-no-files-found: error
          path: |
            out/make/squirrel.windows/x64/*Setup.exe
            out/make/squirrel.windows/x64/SHA256SUMS.txt
      - name: Publish prerelease in this fork
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ru-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^ru-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$') { throw 'Use a unique ru-vMAJOR.MINOR.PATCH-N tag' }
          $notes = @'
          Русский интерфейс irDashies. Установщик для Windows x64.

          Сборка без цифровой подписи; Windows SmartScreen может показать предупреждение. Контрольная сумма SHA-256 приложена.
          '@
          $notes | Set-Content release-notes-ru.md -Encoding utf8
          $installer = (Get-ChildItem out/make/squirrel.windows/x64/*Setup.exe).FullName
          gh release create $env:RELEASE_TAG $installer out/make/squirrel.windows/x64/SHA256SUMS.txt --target $env:GITHUB_SHA --title "irDashies $env:RELEASE_TAG (Русский)" --notes-file release-notes-ru.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
